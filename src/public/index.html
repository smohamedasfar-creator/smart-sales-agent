<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Sales Agent</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #667085; --line: #e3e6eb;
    --accent: #128c7e; --accent-text: #ffffff; --warn: #b54708; --bad: #b42318; --in: #ffffff; --out: #dcf8c6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --card: #1b2129; --text: #e6e9ee; --muted: #98a2b3; --line: #2c343f;
      --accent: #25a594; --accent-text: #0b1210; --warn: #f79009; --bad: #f97066; --in: #222a33; --out: #1f4d45;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 16px 0 0; }
  nav button { background: none; border: 0; padding: 8px 12px; border-radius: 8px; color: var(--muted); font: inherit; cursor: pointer; }
  nav button.active { background: var(--accent); color: var(--accent-text); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .muted { color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); }
  .badge.needs_human, .badge.awaiting_approval { color: var(--warn); border-color: var(--warn); }
  .badge.won { color: var(--accent); border-color: var(--accent); }
  .badge.lost { color: var(--bad); border-color: var(--bad); }
  textarea, input, select { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  textarea { min-height: 140px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  label { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
  button.primary, button.secondary { font: inherit; border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); }
  button.secondary { background: none; color: var(--accent); }
  button.danger { border-color: var(--bad); color: var(--bad); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: var(--bg); }
  .chat { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow-y: auto; padding: 8px; background: var(--bg); border-radius: 8px; }
  .bubble { max-width: 80%; padding: 6px 10px; border-radius: 10px; white-space: pre-wrap; border: 1px solid var(--line); }
  .bubble.in { background: var(--in); align-self: flex-start; }
  .bubble.out { background: var(--out); align-self: flex-end; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 16px; }
  .scroll { overflow-x: auto; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Smart Sales Agent</h1>
  <nav class="row">
    <button data-tab="approvals" class="active">Approvals <span id="approval-count"></span></button>
    <button data-tab="enquiries">Enquiries</button>
    <button data-tab="suppliers">Suppliers</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="test">Test chat</button>
  </nav>
</header>
<main>
  <section id="approvals"></section>

  <section id="enquiries" hidden>
    <div class="card scroll"><table id="enquiry-table"></table></div>
    <div id="enquiry-detail"></div>
  </section>

  <section id="suppliers" hidden>
    <div class="card">
      <strong>Add supplier</strong>
      <div class="grid">
        <div><label>Name</label><input id="s-name"></div>
        <div><label>WhatsApp number (country code, no +)</label><input id="s-phone" placeholder="971501234567"></div>
        <div><label>Email</label><input id="s-email"></div>
        <div><label>Categories (comma separated, empty = all)</label><input id="s-categories"></div>
      </div>
      <p><button class="primary" id="add-supplier">Add supplier</button></p>
    </div>
    <div class="card scroll"><table id="supplier-table"></table></div>
  </section>

  <section id="settings" hidden>
    <div class="card" id="connections"></div>
    <div class="card">
      <div class="grid">
        <div><label>Business name</label><input id="businessName"></div>
        <div><label>Currency</label><input id="currency"></div>
        <div><label>Default margin %</label><input id="defaultPercent" type="number" step="0.1"></div>
        <div>
          <label>Price basis</label>
          <select id="priceBasis">
            <option value="list">Use the price list's selling price when there is one</option>
            <option value="cost">Always cost + margin</option>
          </select>
        </div>
        <div><label>Round unit prices up to (0 = no rounding)</label><input id="roundTo" type="number" step="0.01"></div>
        <div><label>VAT / tax %</label><input id="taxPercent" type="number" step="0.1"></div>
        <div><label>Quote valid for (days)</label><input id="quoteValidityDays" type="number"></div>
        <div><label>Follow up after (hours, comma separated)</label><input id="followupHours"></div>
        <div><label>Remind supplier after (hours)</label><input id="supplierReminderHours" type="number"></div>
        <div><label>Stop waiting for supplier after (hours)</label><input id="supplierGiveUpHours" type="number"></div>
      </div>
      <label><input type="checkbox" id="requireApproval" style="width:auto"> Quotes wait for my approval before they are sent</label>
      <label>Margin % by category (JSON, e.g. {"Pipes": 12, "Fittings": 20})</label><input id="byCategory">
      <label>Margin % by customer number (JSON, e.g. {"971501234567": 8})</label><input id="byCustomer">
      <label>Personal contacts: family, friends and others the agents must never answer (one per line: number, name)</label>
      <textarea id="personalContacts" placeholder="971501234567, Ahmed (brother)"></textarea>
      <label>Tone of replies</label><input id="tone">
      <label>Business information the agents may share (address, hours, payment and delivery terms)</label>
      <textarea id="businessInfo"></textarea>
      <p><button class="primary" id="save-settings">Save settings</button> <span id="settings-saved" class="muted"></span></p>
    </div>
  </section>

  <section id="test" hidden>
    <div class="card">
      <p class="muted">Send a message as if a customer wrote it on WhatsApp. If WhatsApp is not connected yet, replies appear in the server log and in the enquiry's chat.</p>
      <div class="grid">
        <div><label>Customer number</label><input id="t-from" value="971500000001"></div>
        <div><label>Customer name</label><input id="t-name" value="Test Customer"></div>
      </div>
      <label>Message</label><input id="t-text" placeholder="Hi, price for 50 pcs PVC pipe 4 inch?">
      <p><button class="primary" id="t-send">Send</button> <span id="t-status" class="muted"></span></p>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

async function api(path, options = {}) {
  const response = await fetch(`/api${path}`, {
    ...options,
    headers: { "Content-Type": "application/json" },
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) { alert(data.error || `Error ${response.status}`); throw new Error(data.error); }
  return data;
}

document.querySelectorAll("nav button").forEach((button) => button.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b === button));
  document.querySelectorAll("main > section").forEach((s) => (s.hidden = s.id !== button.dataset.tab));
  refresh();
}));

async function loadApprovals() {
  const drafts = await api("/drafts");
  $("approval-count").textContent = drafts.length ? `(${drafts.length})` : "";
  $("approvals").innerHTML = drafts.length === 0
    ? `<div class="card muted">Nothing is waiting for approval.</div>`
    : drafts.map((d) => `
      <div class="card">
        <div class="row"><strong>${esc(d.kind)} to +${esc(d.to_phone)}</strong><span class="muted">Enquiry E${esc(d.enquiry_id)} · ${new Date(d.created_at).toLocaleString()}</span></div>
        <label>Message (edit before sending if needed)</label>
        <textarea id="draft-${d.id}">${esc(d.body)}</textarea>
        <p class="row">
          <button class="primary" onclick="approve(${d.id})">Approve and send</button>
          <button class="secondary danger" onclick="reject(${d.id})">Reject (I'll handle it)</button>
        </p>
      </div>`).join("");
}
async function approve(id) { await api(`/drafts/${id}/approve`, { method: "POST", body: { body: $(`draft-${id}`).value } }); refresh(); }
async function reject(id) { await api(`/drafts/${id}/reject`, { method: "POST" }); refresh(); }

async function loadEnquiries() {
  const rows = await api("/enquiries");
  $("enquiry-table").innerHTML = `<tr><th>#</th><th>Customer</th><th>Status</th><th>Quote</th><th>Updated</th></tr>` +
    rows.map((e) => `<tr class="clickable" onclick="showEnquiry(${e.id})">
      <td>E${e.id}</td><td>${esc(e.name || "")} <span class="muted">+${esc(e.phone)}</span></td>
      <td><span class="badge ${esc(e.status)}">${esc(e.status.replace("_", " "))}</span></td>
      <td>${esc(e.quote_ref || "")} ${e.quote_total != null ? esc(e.quote_total.toFixed(2)) : ""}</td>
      <td class="muted">${new Date(e.updated_at).toLocaleString()}</td></tr>`).join("");
}

async function showEnquiry(id) {
  const d = await api(`/enquiries/${id}`);
  const items = d.items.map((i) => `<tr><td>${esc(i.quantity)} ${esc(i.unit || "")}</td><td>${esc(i.description)}<div class="muted">${esc(i.matched_name || "not matched")}</div></td>
    <td>${i.available === 1 ? esc(i.source) : i.available === 0 ? "not available" : "?"}</td><td>${esc(i.cost ?? "")}</td><td>${esc(i.list_price ?? "")}</td></tr>`).join("");
  const suppliers = d.supplierRequests.map((r) => `<li>Supplier #${esc(r.supplier_id)} by ${esc(r.channel)}: ${esc(r.status)}${r.reply ? ` — "${esc(r.reply.slice(0, 200))}"` : ""}</li>`).join("");
  $("enquiry-detail").innerHTML = `
    <div class="card">
      <div class="row"><strong>E${d.enquiry.id} · ${esc(d.customer.name || "")} +${esc(d.customer.phone)}</strong>
        <span class="badge ${esc(d.enquiry.status)}">${esc(d.enquiry.status.replace("_", " "))}</span>
        ${d.enquiry.notes ? `<span class="muted">${esc(d.enquiry.notes)}</span>` : ""}
        ${d.enquiry.status === "needs_human" ? `<button class="secondary" onclick="resume(${d.enquiry.id})">Let the agents continue</button>` : ""}</div>
      <label>Chat</label>
      <div class="chat">${d.messages.map((m) => `<div class="bubble ${m.direction}">${esc(m.body)}<div class="muted">${new Date(m.created_at).toLocaleString()}</div></div>`).join("")}</div>
      <div class="row" style="margin-top:8px"><input id="manual-text" placeholder="Type a message to the customer" style="flex:1"><button class="primary" onclick="sendManual(${d.enquiry.id})">Send</button></div>
      <label>Items</label>
      <div class="scroll"><table><tr><th>Qty</th><th>Item</th><th>Source</th><th>Cost</th><th>List price</th></tr>${items || `<tr><td colspan="5" class="muted">No items yet</td></tr>`}</table></div>
      ${suppliers ? `<label>Supplier requests</label><ul>${suppliers}</ul>` : ""}
    </div>`;
}
async function resume(id) { await api(`/enquiries/${id}/resume`, { method: "POST" }); showEnquiry(id); loadEnquiries(); }
async function sendManual(id) {
  const body = $("manual-text").value.trim();
  if (!body) return;
  await api(`/enquiries/${id}/message`, { method: "POST", body: { body } });
  showEnquiry(id);
}

async function loadSuppliers() {
  const rows = await api("/suppliers");
  $("supplier-table").innerHTML = `<tr><th>#</th><th>Name</th><th>WhatsApp</th><th>Email</th><th>Categories</th><th>Active</th></tr>` +
    rows.map((s) => `<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${esc(s.phone || "")}</td><td>${esc(s.email || "")}</td><td>${esc(s.categories || "all")}</td>
      <td><input type="checkbox" style="width:auto" ${s.active ? "checked" : ""} onchange='toggleSupplier(${JSON.stringify(s)}, this.checked)'></td></tr>`).join("");
}
async function toggleSupplier(s, active) { await api(`/suppliers/${s.id}`, { method: "PUT", body: { ...s, active } }); }
$("add-supplier").addEventListener("click", async () => {
  await api("/suppliers", { method: "POST", body: { name: $("s-name").value, phone: $("s-phone").value.replace(/\D/g, ""), email: $("s-email").value, categories: $("s-categories").value } });
  ["s-name", "s-phone", "s-email", "s-categories"].forEach((id) => ($(id).value = ""));
  loadSuppliers();
});

const plain = ["businessName", "currency", "tone", "businessInfo", "taxPercent", "quoteValidityDays", "supplierReminderHours", "supplierGiveUpHours"];
async function loadSettings() {
  const s = await api("/settings");
  plain.forEach((key) => ($(key).value = s[key]));
  $("requireApproval").checked = s.requireApproval;
  $("followupHours").value = s.followupHours.join(", ");
  $("defaultPercent").value = s.margin.defaultPercent;
  $("priceBasis").value = s.margin.priceBasis;
  $("roundTo").value = s.margin.roundTo;
  $("byCategory").value = JSON.stringify(s.margin.byCategory);
  $("byCustomer").value = JSON.stringify(s.margin.byCustomer);
  $("personalContacts").value = (s.personalContacts || []).map((c) => `${c.phone}, ${c.name}`).join("\n");
}
// Connections: the keys live in the server's .env file (never in this page); this shows what is set up and where to get each one.
async function loadConnections() {
  const c = await api("/connections");
  const dot = (ok) => `<span class="badge ${ok ? "won" : "needs_human"}">${ok ? "Connected" : "Not connected"}</span>`;
  const link = (url, text) => `<a href="${url}" target="_blank" rel="noopener">${text}</a>`;
  $("connections").innerHTML = `
    <strong>Connections</strong>
    <p class="muted">Keys and passwords are kept in the <code>.env</code> file on your server, not on this page. Fill in the lines named below, then restart the app.</p>
    <table>
      <tr><td><strong>Claude</strong> (the AI agents)</td><td>${dot(c.claude)}</td>
        <td>Create a key at ${link("https://console.anthropic.com/settings/keys", "Anthropic Console → API keys")}. Set <code>ANTHROPIC_API_KEY</code>.</td></tr>
      <tr><td><strong>WhatsApp</strong> (Meta)</td><td>${dot(c.whatsapp.connected)}</td>
        <td>In ${link("https://developers.facebook.com/apps", "Meta for Developers → your app → WhatsApp → API setup")}: set <code>WHATSAPP_ACCESS_TOKEN</code> (a permanent System User token from ${link("https://business.facebook.com/settings/system-users", "Business settings → System users")}) and <code>WHATSAPP_PHONE_NUMBER_ID</code>.
        App settings → Basic gives <code>WHATSAPP_APP_SECRET</code>; choose any <code>WHATSAPP_VERIFY_TOKEN</code>.<br>
        Webhook (WhatsApp → Configuration): <code>${esc(c.whatsapp.webhookUrl)}</code> ${c.whatsapp.webhookReady ? "" : `<span class="badge needs_human">app secret or verify token missing</span>`}, subscribe to <em>messages</em> and <em>smb_message_echoes</em> (so the agents step back when you reply from the WhatsApp Business app).<br>
        Templates (${link("https://business.facebook.com/wa/manage/message-templates/", "WhatsApp Manager → Message templates")}): follow-up ${c.whatsapp.followupTemplate ? `<code>${esc(c.whatsapp.followupTemplate)}</code>` : "not set"}, supplier ${c.whatsapp.supplierTemplate ? `<code>${esc(c.whatsapp.supplierTemplate)}</code>` : "not set"}.</td></tr>
      <tr><td><strong>Zoho</strong> (${esc(c.zoho.app === "inventory" ? "Inventory" : "Books")})</td><td>${dot(c.zoho.connected)}</td>
        <td>At ${link(`https://api-console.${c.zoho.domain}`, "Zoho API Console")} create a Self Client and a refresh token (scope <code>ZohoBooks.fullaccess.all</code> or <code>ZohoInventory.fullaccess.all</code>). Set <code>ZOHO_CLIENT_ID</code>, <code>ZOHO_CLIENT_SECRET</code>, <code>ZOHO_REFRESH_TOKEN</code>, <code>ZOHO_ORGANIZATION_ID</code> and <code>ZOHO_DOMAIN</code> (zoho.com, zoho.in, zoho.eu…). Price list in use: ${esc(c.priceList)}.</td></tr>
      <tr><td><strong>Email</strong> (suppliers)</td><td>${dot(c.email.connected)}</td>
        <td>Set <code>EMAIL_USER</code>, <code>EMAIL_PASSWORD</code> (an app password), <code>EMAIL_SMTP_HOST</code> and <code>EMAIL_IMAP_HOST</code>.${c.email.from ? ` Sending as ${esc(c.email.from)}.` : ""}</td></tr>
    </table>`;
}

$("save-settings").addEventListener("click", async () => {
  let byCategory, byCustomer;
  try { byCategory = JSON.parse($("byCategory").value || "{}"); byCustomer = JSON.parse($("byCustomer").value || "{}"); }
  catch { alert("The margin lists must be valid JSON, like {\"Pipes\": 12}"); return; }
  const body = { requireApproval: $("requireApproval").checked };
  plain.forEach((key) => (body[key] = $(key).type === "number" ? Number($(key).value) : $(key).value));
  body.followupHours = $("followupHours").value.split(",").map((h) => Number(h.trim())).filter((h) => h > 0);
  body.personalContacts = $("personalContacts").value.split("\n").map((line) => {
    const [phone, ...name] = line.split(",");
    return { phone: (phone || "").replace(/\D/g, ""), name: name.join(",").trim() };
  }).filter((c) => c.phone);
  body.margin = { defaultPercent: Number($("defaultPercent").value), priceBasis: $("priceBasis").value, roundTo: Number($("roundTo").value), byCategory, byCustomer };
  await api("/settings", { method: "PUT", body });
  $("settings-saved").textContent = "Saved";
  setTimeout(() => ($("settings-saved").textContent = ""), 2000);
});

$("t-send").addEventListener("click", async () => {
  $("t-status").textContent = "Agents are working…";
  await api("/test-message", { method: "POST", body: { from: $("t-from").value.replace(/\D/g, ""), name: $("t-name").value, text: $("t-text").value } });
  $("t-text").value = "";
  $("t-status").textContent = "Done. See Enquiries or Approvals.";
});

function refresh() {
  loadApprovals();
  if (!$("enquiries").hidden) loadEnquiries();
  if (!$("suppliers").hidden) loadSuppliers();
  if (!$("settings").hidden) { loadSettings(); loadConnections(); }
}
refresh();
setInterval(() => { if (!$("approvals").hidden) loadApprovals(); }, 15000);
</script>
</body>
</html>
